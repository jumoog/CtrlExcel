name: CI

# Builds and runs the Rust tests (rust/) and the C++ tests (tests/). The CTRL
# extension itself needs the proprietary WinCC OA API, which is not available
# here, so it is not built; ExcelRoundTripTest.ctl still has to be run in a
# WinCC OA project (or with docker/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      CARGO_TERM_COLOR: always
      # Warnings fail the build, as -DCMAKE_COMPILE_WARNING_AS_ERROR does for C++
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      # rustup on the runner images; without arguments it installs the
      # toolchain (and components) pinned in rust/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: rust
        run: |
          rustup toolchain install
          cargo --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

      - name: Rust format and lints
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked

      # A warning, not a failure, so dependency updates (Dependabot) still
      # pass; regenerate the file before merging.
      - name: Third-party licenses up to date
        if: runner.os == 'Linux'
        run: |
          python3 rust/third_party_licenses.py
          if ! git diff --quiet -- THIRD-PARTY-LICENSES.txt; then
            echo "::warning file=THIRD-PARTY-LICENSES.txt::out of date with rust/Cargo.lock; run python rust/third_party_licenses.py"
          fi

      - name: Rust tests
        working-directory: rust
        run: cargo test --locked

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCTRLEXCEL_BUILD_EXTENSION=OFF
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: C++ tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
